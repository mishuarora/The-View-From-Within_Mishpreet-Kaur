<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outside Gallery | Inside and Outside</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="outside-gallery-page">

  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="site-header orange-header">
    <a href="index.html" class="logo">Inside and Outside</a>

    <button
      class="menu-toggle"
      id="menuToggle"
      type="button"
      aria-label="Open navigation menu"
      aria-controls="primaryNavigation"
      aria-expanded="false">
      ☰
    </button>

    <nav class="nav-links" id="primaryNavigation" aria-label="Primary navigation">
      <a href="index.html">Home</a>
      <a href="inside.html">Inside</a>
      <a href="outside.html" class="active" aria-current="page">Outside</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main id="main-content" class="gallery-page fade-in">

    <section class="gallery-heading">
      <p class="small-label">Outside Gallery</p>

      <h1>Exterior Moments</h1>

      <p class="gallery-description">
        A visual collection of exterior scenes exploring openness, found
        details, architecture and public space.
      </p>
    </section>

    <section class="image-grid six" aria-label="Exterior photography gallery">

      <figure tabindex="0">
        <img
          src="images/outside-1.jpg"
          alt="A staircase between two green walls opening toward blue sky." />
        <figcaption>Open Pathway</figcaption>
      </figure>

      <figure tabindex="0">
        <img
          src="images/outside-2.jpg"
          alt="A street sign displaying expressive found typography." />
        <figcaption>Found Typography</figcaption>
      </figure>

      <figure tabindex="0">
        <img
          src="images/outside-3.jpg"
          alt="A public screen with purple lighting and racing imagery." />
        <figcaption>Colour Contrast</figcaption>
      </figure>

      <figure tabindex="0">
        <img
          src="images/outside-4.jpg"
          alt="A geometric outdoor structure framing a walkway." />
        <figcaption>Architectural Frame</figcaption>
      </figure>

      <figure tabindex="0">
        <img
          src="images/outside-5.jpg"
          alt="Sunlight reflecting through the windows of an urban building." />
        <figcaption>City Light</figcaption>
      </figure>

      <figure tabindex="0">
        <img
          src="images/outside-6.jpg"
          alt="Soft clouds in a pastel-coloured evening sky." />
        <figcaption>Open Sky</figcaption>
      </figure>

    </section>

    <div class="center-button double-buttons">
      <a href="outside.html" class="btn orange-btn">Back to Outside</a>
      <a href="about.html" class="btn orange-btn">About Project</a>
    </div>

  </main>

  <footer class="site-footer orange-footer">
    <span class="footer-title">The View From Within</span>

    <div class="footer-links">
      <a href="outside.html">Outside</a>
      <a href="about.html">About</a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
